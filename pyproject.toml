[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hippomem"
version = "0.3.0"
description = "A team's engineering memory for AI coding agents: the decisions behind the software, and the options rejected"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "z10 labs" }]
keywords = ["mcp", "ai-agents", "decision-records", "adr", "engineering-memory", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    # Pinned below 2.0: the streamable HTTP transport and the per-request
    # context used for identity differ in 2.x. See BD-07 in
    # docs/build-decisions.md.
    "mcp>=1.25,<2",
    "fastembed>=0.4.0",
    "numpy>=1.26.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/z10-labs/hippomem"
Repository = "https://github.com/z10-labs/hippomem"
Issues = "https://github.com/z10-labs/hippomem/issues"

[project.scripts]
hippomem = "hippomem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 150

[tool.ruff.lint]
# Conservative baseline (pycodestyle errors/warnings + pyflakes). Widen this
# once there's a reason to.
select = ["E", "F", "W"]

[tool.mypy]
# No explicit python_version: let mypy infer it from the interpreter that
# runs it (CI runs a 3.11/3.12 matrix).
ignore_missing_imports = true
