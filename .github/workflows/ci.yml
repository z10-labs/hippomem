name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: the realistic breakage mode is an upstream dependency (mcp,
    # fastembed) moving underneath this repo, not a bad commit here.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Tests with coverage
        run: pytest --cov=src --cov-report=term-missing
      - name: mypy
        run: mypy src/

  install-from-clean-checkout:
    # Installs non-editable from pyproject.toml, the way `pip install
    # git+https://github.com/z10-labs/hippomem.git` does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      - name: Verify the CLI entry point works
        run: hippomem --version
