# --- decoys: memory should not change anything -----------------------------
# Scored on: did the run stay inside the task (files touched), turns, cost,
# Hippomem tool calls, and whether the final message raises unrelated
# decisions or asks needless questions (grader).
#
# Rewritten 2026-11-06, before R3 (docs/research/log.md): R1's first two
# decoys had already been done during the timeline. These are written to make
# sense whatever the timeline's agents built.

[[decoys]]
id = "Q01"
repo = "storefront"
engineer = "@sam"
prompt = "Add a short 'Development' section to README.md saying how to install dependencies and start the dev server."
allowed_files = ['README.md']

[[decoys]]
id = "Q02"
repo = "ledger-api"
engineer = "@alex"
prompt = "Add an .editorconfig at the repo root: UTF-8, LF line endings, 4-space indentation for Python, 2 for YAML."
allowed_files = ['.editorconfig']

[[decoys]]
id = "Q03"
repo = "ledger-worker"
engineer = "@jo"
prompt = "Add a module docstring to src/ledger_worker/scheduler.py explaining in two sentences what the scheduler does."
