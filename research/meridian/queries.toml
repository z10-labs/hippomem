# The query set for E3, E7 and E9 (docs/research-plan.md). Written
# 2026-11-05, before any run. Questions marked held_out are never looked at
# while fixing the product; they only confirm that a fix generalises.
#
# Each answer is graded against `must` (points a correct answer contains) and
# `must_not` (claims that would be wrong, usually a stale fact stated as
# current). `as_of` questions ask about a past date; the right answer is
# what was in force then.
#
# kind: why | rejected | current | as_of | depends | stale | explored | legacy

[[queries]]
id = "Q01"
kind = "why"
question = "Why does ledger-api store money as integers?"
truth = ["M01"]
must = ["integer minor units (cents)", "floats round wrongly", "allows arithmetic and comparison in SQL"]
must_not = []

[[queries]]
id = "Q02"
kind = "rejected"
question = "What representations of money did the team reject, and why?"
truth = ["M01"]
must = ["floats: rounding errors", "decimal strings: no arithmetic or sorting in SQL"]
must_not = []

[[queries]]
id = "Q03"
kind = "current"
held_out = true
question = "How is API rate limiting done at Meridian today?"
truth = ["M15"]
must = ["in the API gateway (Envoy) for all services", "services don't keep their own counters"]
must_not = ["ledger-api keeps fixed-window counters in Postgres (as current)"]

[[queries]]
id = "Q04"
kind = "as_of"
as_of = "2026-02-06"
question = "As of 6 February 2026, how did ledger-api rate limit requests?"
truth = ["M07"]
must = ["fixed-window counters in Postgres", "per customer"]
must_not = ["in the API gateway"]

[[queries]]
id = "Q05"
kind = "why"
question = "Why did rate limiting move out of ledger-api?"
truth = ["M15", "M07"]
must = ["one place with consistent limits for all services", "replaced ledger-api's Postgres counters"]
must_not = []

[[queries]]
id = "Q06"
kind = "current"
held_out = true
question = "Can a service add Redis today? Under what conditions?"
truth = ["M21"]
must = ["yes, as a cache only", "run by platform", "Postgres stays the primary datastore"]
must_not = ["no new datastores at all (as current)"]

[[queries]]
id = "Q07"
kind = "as_of"
as_of = "2026-01-30"
question = "In late January 2026, could a service add Redis? Why or why not?"
truth = ["M03"]
must = ["no: Postgres was the only datastore", "platform was one person"]
must_not = ["Redis allowed as a cache"]

[[queries]]
id = "Q08"
kind = "stale"
question = "Which decisions rested on the platform team being one person, and are they still in force?"
truth = ["M03", "M21", "X02", "M13"]
must = ["the Postgres-only rule rested on it", "it was superseded when platform grew to three (Redis as cache allowed)", "the NATS spike was dropped for that reason"]
must_not = []

[[queries]]
id = "Q09"
kind = "current"
held_out = true
question = "How does ledger-worker send payouts to Paystream today, and why?"
truth = ["M19"]
must = ["individually, up to 20 at a time", "Paystream raised the limit to 50 requests/second", "one bad bank account no longer fails a batch"]
must_not = ["batches of 100 through the bulk API (as current)"]

[[queries]]
id = "Q10"
kind = "why"
question = "What happened with duplicate payouts, and what changed because of it?"
truth = ["M16"]
must = ["worker restarted mid-batch on 2026-02-11 and paid recipients twice", "each payout request carries an idempotency key from batch date and recipient id"]
must_not = []

[[queries]]
id = "Q11"
kind = "explored"
question = "Has anyone tried running payout batches from a separate cron container?"
truth = ["X01", "M08"]
must = ["yes, a spike", "it missed runs silently after restarts", "revisit if platform offers monitored scheduled jobs"]
must_not = []

[[queries]]
id = "Q12"
kind = "rejected"
held_out = true
question = "Why doesn't billing use Kafka or NATS for its events?"
truth = ["M13", "X02", "M03"]
must = ["events go through a Postgres outbox polled by ledger-worker", "a new stateful service was too much for a one-person platform", "NATS was spiked and dropped"]
must_not = []

[[queries]]
id = "Q13"
kind = "current"
question = "How should storefront get data from the ledger?"
truth = ["M02", "M05"]
must = ["through ledger-api's API, never its database", "using the client generated from the OpenAPI spec"]
must_not = []

[[queries]]
id = "Q14"
kind = "why"
question = "Why are refunds recorded as new negative entries instead of edits?"
